# SPDX-License-Identifier: GPL-3.0-or-later

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-x86_64:
    name: Build x86_64 Linux Release Tarball
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            scdoc \
            wayland-protocols \
            libwayland-dev \
            libwayland-bin \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libgles2-mesa-dev \
            libva-dev \
            liburing-dev \
            libseccomp-dev \
            libpng-dev \
            libturbojpeg0-dev \
            systemd-dev

      - name: Build release binaries
        run: |
          meson setup build \
            --prefix=/usr \
            --buildtype=release \
            -Doptimization=3 \
            -Db_lto=true \
            -Db_pie=true \
            -Dtests=false \
            -Denable_vaapi=true \
            -Denable_io_uring=true \
            -Denable_simd=true \
            -Denable_seccomp=true \
            -Denable_systemd=true
          meson compile -C build
          DESTDIR="${RUNNER_TEMP}/pkg" meson install -C build
          strip --strip-unneeded "${RUNNER_TEMP}/pkg/usr/bin/wwal" "${RUNNER_TEMP}/pkg/usr/bin/wwald"

      - name: Package release archive & checksums
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="wwal-${TAG}-linux-x86_64.tar.gz"
          cp LICENSE README.md CHANGELOG.md "${RUNNER_TEMP}/pkg/"
          tar -C "${RUNNER_TEMP}/pkg" -czf "${ARCHIVE}" .
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --generate-notes --title "wwal ${TAG}"
          fi
          gh release upload "${TAG}" "wwal-${TAG}-linux-x86_64.tar.gz" "wwal-${TAG}-linux-x86_64.tar.gz.sha256" --clobber
